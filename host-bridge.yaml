# host-bridge-mcp configuration template
#
# This file is safe for a local development start:
# - the HTTP server binds to loopback
# - normal commands require approval from the local TUI
# - only the local `host` execution target is enabled
#
# Configuration lookup order:
# 1. --config <PATH>
# 2. HOST_BRIDGE_CONFIG
# 3. host-bridge.yaml in the current directory
#
# YAML note: quote a standalone wildcard, for example `command: "*"`.

server:
  # HTTP bind address. Keep this on loopback unless the network is trusted.
  address: 127.0.0.1:8787

  # Optional bearer-token authentication for /mcp and execution streams.
  # The value is an environment variable name, not the secret itself.
  # access:
  #   api-key-env: HOST_BRIDGE_API_KEY

logging:
  # Number of recent log lines kept in memory for fast TUI access.
  memory-buffer-lines: 2000

  # Keep the current log file after shutdown.
  persist-file: false

  # Optional explicit backing log file. If omitted, logs live under the
  # host-bridge data directory.
  # file-path: /absolute/path/to/host-bridge-mcp.log

execution:
  # Fallback for commands without a matching command policy.
  # allow   = run a normal command without approval
  # confirm = wait for approval in the local TUI
  # deny    = reject a normal command
  default-action: confirm

  # The local execution target is always named `host`.
  default-server: host

  # Platform used by the local target. Supported values: auto, windows,
  # linux, macos.
  target-platform: auto

  # Default timeout for execute_command requests: 30 minutes.
  default-timeout-ms: 1800000

  # Maximum request timeout: 2 hours.
  max-timeout-ms: 7200000

  # Optional working directory used when a request does not provide one.
  # Use a path that exists on the selected target.
  # default-working-directory: /path/to/workspace

  # Optional command policies. The command value supports `*`, matching zero
  # or more characters. Exact command policies take precedence over wildcard
  # policies. Review a catch-all `allow` policy carefully.
  # commands:
  #   - command: "*"
  #     action: allow
  #   - command: rm
  #     action: deny
  #   - command: "sudo*"
  #     action: confirm
  #   - command: cargo
  #     action: allow
  #     rules:
  #       - args-prefix:
  #           - publish
  #         action: confirm

  # Optional named SSH execution targets.
  # An SSH target must specify target-platform explicitly.
  # servers:
  #   - transport: ssh
  #     name: build-linux
  #     host: build.example.com
  #     port: 22
  #     user: builder
  #     target-platform: linux
  #     auth:
  #       type: agent
  #
  #     # Recommended: keep strict SSH host-key verification enabled.
  #     known-hosts-file: /home/builder/.ssh/known_hosts
  #     connection-idle-timeout-ms: 300000
  #
  #     # Other authentication forms:
  #     # auth:
  #     #   type: identity-file
  #     #   ref: /path/to/private/key
  #     # auth:
  #     #   type: password-env
  #     #   ref: BUILD_SSH_PASSWORD
  #     # auth:
  #     #   type: password-file
  #     #   ref: /path/to/password-file
